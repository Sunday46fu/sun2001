<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Dealer Booking - Realtime</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

    <style>
        body { font-family: 'Prompt', sans-serif; background: #0f172a; color: #f8fafc; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); }
        .brand-card.active { border-color: #3b82f6; background: rgba(59, 130, 246, 0.2); transform: translateY(-2px); }
        .time-chip.active { background: #3b82f6; color: white; border-color: #3b82f6; }
    </style>
</head>
<body class="min-h-screen p-4 pb-10">

    <div class="max-w-md mx-auto">
        <div class="text-center my-8">
            <h1 class="text-3xl font-600 bg-gradient-to-r from-blue-400 to-cyan-400 bg-clip-text text-transparent">จองคิวโชว์รูม</h1>
            <p class="text-slate-400 text-sm mt-2">Realtime Booking System</p>
        </div>

        <div class="glass rounded-3xl p-6 shadow-2xl">
            <label class="block text-blue-400 text-xs font-semibold mb-4 uppercase tracking-widest">เลือกแบรนด์รถยนต์</label>
            <div class="grid grid-cols-3 gap-3 mb-8" id="brandGrid"></div>

            <div class="mb-8">
                <label class="block text-blue-400 text-xs font-semibold mb-3 uppercase tracking-widest">วันที่นัดหมาย</label>
                <input type="date" id="dateInput" class="w-full bg-slate-800 border border-slate-700 rounded-2xl p-4 text-white focus:ring-2 focus:ring-blue-500 outline-none">
            </div>

            <div class="mb-10">
                <label class="block text-blue-400 text-xs font-semibold mb-4 uppercase tracking-widest">ช่วงเวลา</label>
                <div class="grid grid-cols-3 gap-2" id="timeGrid"></div>
            </div>

            <button id="confirmBtn" class="w-full bg-blue-600 hover:bg-blue-500 py-4 rounded-2xl font-bold text-lg shadow-lg shadow-blue-900/40 transition-all active:scale-95">
                ยืนยันการนัดหมาย
            </button>
            <p id="status" class="text-center mt-4 text-xs text-slate-500 tracking-wide"></p>
        </div>
    </div>

    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

    <script>
        // --- Firebase Config (จัดเต็มตามที่พี่ให้มา) ---
        const firebaseConfig = {
            apiKey: "AIzaSyAWUWpDnF5Yt7QQ0ULvsxSVJhV0ckGMfu8",
            authDomain: "chatcharin-af5e4.firebaseapp.com",
            databaseURL: "https://chatcharin-af5e4-default-rtdb.firebaseio.com",
            projectId: "chatcharin-af5e4",
            storageBucket: "chatcharin-af5e4.firebasestorage.app",
            messagingSenderId: "631954642041",
            appId: "1:631954642041:web:586447ace8ad055ca3f0a8",
            measurementId: "G-2GNPMEF6E4"
        };
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database(); // ใช้ REALTIME DATABASE

        const brands = ["Toyota", "Honda", "BMW", "Benz", "BYD", "Tesla"];
        const times = ["09:00", "10:30", "13:00", "14:30", "16:00", "17:30"];
        let selectedBrand = "";
        let selectedTime = "";

        // UI Generation
        const brandGrid = document.getElementById('brandGrid');
        brands.forEach(b => {
            const div = document.createElement('div');
            div.className = "brand-card glass p-3 text-center rounded-xl cursor-pointer text-xs font-medium transition-all border border-transparent";
            div.innerText = b;
            div.onclick = () => {
                document.querySelectorAll('.brand-card').forEach(c => c.classList.remove('active'));
                div.classList.add('active');
                selectedBrand = b;
            };
            brandGrid.appendChild(div);
        });

        const timeGrid = document.getElementById('timeGrid');
        times.forEach(t => {
            const div = document.createElement('div');
            div.className = "time-chip border border-slate-700 p-2 text-center rounded-xl cursor-pointer text-xs transition-all";
            div.innerText = t;
            div.onclick = () => {
                document.querySelectorAll('.time-chip').forEach(c => c.classList.remove('active'));
                div.classList.add('active');
                selectedTime = t;
            };
            timeGrid.appendChild(div);
        });

        async function init() {
            try {
                await liff.init({ liffId: "2010010460-avlyckMz" });
                if (!liff.isLoggedIn()) liff.login();
            } catch (e) { console.error("LIFF Error", e); }
        }
        init();

        document.getElementById('confirmBtn').onclick = async () => {
            const date = document.getElementById('dateInput').value;
            const statusText = document.getElementById('status');

            if (!selectedBrand || !selectedTime || !date) return alert("กรุณาเลือกข้อมูลให้ครบ");

            statusText.innerText = "กำลังบันทึกข้อมูล...";
            
            try {
                const profile = await liff.getProfile();
                
                // บันทึกเข้า REALTIME DATABASE (.ref().push())
                const newBookingRef = db.ref('bookings').push();
                await newBookingRef.set({
                    userId: profile.userId,
                    displayName: profile.displayName,
                    brand: selectedBrand,
                    date: date,
                    time: selectedTime,
                    timestamp: firebase.database.ServerValue.TIMESTAMP,
                    status: "pending"
                });

                // แจ้งเตือนผ่าน Netlify Function
                await fetch('/.netlify/functions/send-message', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        userId: profile.userId,
                        message: `✅ จองคิวสำเร็จ!\nแบรนด์: ${selectedBrand}\nวันที่: ${date}\nเวลา: ${selectedTime} น.`
                    })
                });

                statusText.innerText = "บันทึกสำเร็จ! กำลังปิด...";
                setTimeout(() => liff.closeWindow(), 2000);
            } catch (err) {
                statusText.innerText = "Error: " + err.message;
                console.error(err);
            }
        };
    </script>
</body>
</html>
