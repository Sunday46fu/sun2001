<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZIS Car Service - Booking</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

    <style>
        body { font-family: 'Prompt', sans-serif; background: #0a0a0a; color: #f8fafc; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); }
        .brand-card { transition: all 0.3s ease; border: 1px solid rgba(201, 168, 76, 0.1); }
        .brand-card.active { border-color: #C9A84C; background: rgba(201, 168, 76, 0.2); transform: translateY(-2px); box-shadow: 0 0 15px rgba(201, 168, 76, 0.3); }
        .time-chip.active { background: #C9A84C; color: #0a0a0a; border-color: #C9A84C; font-weight: 600; }
        input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(0.8) sepia(1) saturate(5) hue-rotate(10deg); }
    </style>
</head>
<body class="min-h-screen p-4 flex items-center justify-center">

    <div class="w-full max-w-md">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-[#C9A84C] tracking-widest">ZIS CAR SERVICE</h1>
            <p class="text-slate-500 text-xs mt-2 uppercase tracking-tighter">Premium Auto Experience</p>
        </div>

        <div class="glass rounded-3xl p-6 shadow-2xl border-t-2 border-[#C9A84C]/30">
            <label class="block text-[#C9A84C] text-[10px] font-semibold mb-4 uppercase tracking-[0.2em]">Select Brand</label>
            <div class="grid grid-cols-3 gap-3 mb-8" id="brandGrid"></div>

            <div class="mb-8">
                <label class="block text-[#C9A84C] text-[10px] font-semibold mb-3 uppercase tracking-[0.2em]">Appointment Date</label>
                <input type="date" id="dateInput" class="w-full bg-white/5 border border-white/10 rounded-2xl p-4 text-white focus:ring-1 focus:ring-[#C9A84C] outline-none">
            </div>

            <div class="mb-10">
                <label class="block text-[#C9A84C] text-[10px] font-semibold mb-4 uppercase tracking-[0.2em]">Preferred Time</label>
                <div class="grid grid-cols-3 gap-2" id="timeGrid"></div>
            </div>

            <button id="confirmBtn" class="w-full bg-[#C9A84C] hover:bg-[#d4b96a] text-[#0a0a0a] py-4 rounded-2xl font-bold text-lg transition-all active:scale-95 disabled:opacity-50 shadow-lg shadow-yellow-900/20">
                CONFIRM BOOKING
            </button>
            <p id="status" class="text-center mt-4 text-[10px] text-slate-500 tracking-widest h-4 uppercase"></p>
        </div>
    </div>

    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAWUWpDnF5Yt7QQ0ULvsxSVJhV0ckGMfu8",
            authDomain: "chatcharin-af5e4.firebaseapp.com",
            databaseURL: "https://chatcharin-af5e4-default-rtdb.firebaseio.com",
            projectId: "chatcharin-af5e4",
            storageBucket: "chatcharin-af5e4.firebasestorage.app",
            messagingSenderId: "631954642041",
            appId: "1:631954642041:web:586447ace8ad055ca3f0a8",
            measurementId: "G-2GNPMEF6E4"
        };
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const brands = ["Toyota", "Honda", "BMW", "Benz", "BYD", "Tesla"];
        const times = ["09:00", "10:30", "13:00", "14:30", "16:00", "17:30"];
        let selectedBrand = "";
        let selectedTime = "";

        const brandGrid = document.getElementById('brandGrid');
        brands.forEach(b => {
            const div = document.createElement('div');
            div.className = "brand-card glass p-3 text-center rounded-xl cursor-pointer text-[11px] font-medium";
            div.innerText = b;
            div.onclick = () => {
                document.querySelectorAll('.brand-card').forEach(c => c.classList.remove('active'));
                div.classList.add('active');
                selectedBrand = b;
            };
            brandGrid.appendChild(div);
        });

        const timeGrid = document.getElementById('timeGrid');
        times.forEach(t => {
            const div = document.createElement('div');
            div.className = "time-chip border border-white/10 p-2 text-center rounded-xl cursor-pointer text-xs";
            div.innerText = t;
            div.onclick = () => {
                document.querySelectorAll('.time-chip').forEach(c => c.classList.remove('active'));
                div.classList.add('active');
                selectedTime = t;
            };
            timeGrid.appendChild(div);
        });

        async function init() {
            try {
                await liff.init({ liffId: "2010010460-avlyckMz" });
                if (!liff.isLoggedIn()) liff.login();
            } catch (e) { console.error(e); }
        }
        init();

        document.getElementById('confirmBtn').onclick = async () => {
            const date = document.getElementById('dateInput').value;
            const statusText = document.getElementById('status');
            const btn = document.getElementById('confirmBtn');

            if (!selectedBrand || !selectedTime || !date) return alert("Please complete all fields.");

            btn.disabled = true;
            statusText.innerText = "Processing Your Request...";
            
            try {
                const profile = await liff.getProfile();
                
                // 1. บันทึกลง Database
                await db.ref('bookings').push().set({
                    userId: profile.userId,
                    displayName: profile.displayName,
                    brand: selectedBrand,
                    date: date,
                    time: selectedTime,
                    timestamp: firebase.database.ServerValue.TIMESTAMP
                });

                // 2. ส่งข้อมูลไปที่ Function (จุดสำคัญที่ต้องแก้)
                const response = await fetch('/.netlify/functions/send-message', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        userId: profile.userId,
                        brand: selectedBrand, // ต้องส่ง brand ไป
                        date: date,          // ต้องส่ง date ไป
                        time: selectedTime    // ต้องส่ง time ไป
                    })
                });

                if (response.ok) {
                    statusText.innerText = "SUCCESS! CLOSING WINDOW...";
                    statusText.style.color = "#C9A84C";
                    setTimeout(() => liff.closeWindow(), 2000);
                } else {
                    const errData = await response.json();
                    throw new Error(errData.details?.message || "Send failed");
                }

            } catch (err) {
                btn.disabled = false;
                statusText.innerText = "ERROR: " + err.message;
                console.error(err);
            }
        };
    </script>
</body>
</html>
