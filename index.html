<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Store Admin - Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap');
        body { font-family: 'Kanit', sans-serif; background: #f8fafc; }
        .glass { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
    </style>
</head>
<body class="bg-slate-50 min-h-screen">

    <!-- Navigation -->
    <nav class="glass sticky top-0 z-40 border-b border-slate-200 px-6 py-4 flex justify-between items-center">
        <div class="flex items-center gap-3">
            <div class="bg-blue-600 p-2 rounded-xl text-white shadow-lg shadow-blue-200">
                <i class="fa-solid fa-rocket text-xl"></i>
            </div>
            <h1 class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-600 to-indigo-600">Super Admin App</h1>
        </div>
        <button onclick="openProductModal()" class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2.5 rounded-xl shadow-lg transition-all flex items-center gap-2">
            <i class="fa-solid fa-plus"></i> เพิ่มสินค้าใหม่
        </button>
    </nav>

    <main class="max-w-7xl mx-auto p-6 space-y-8">
        <!-- Stats Row -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                <p class="text-slate-500 text-sm">ยอดออเดอร์วันนี้</p>
                <h2 id="stat-orders" class="text-3xl font-bold mt-1 text-slate-800">0</h2>
            </div>
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                <p class="text-slate-500 text-sm">สต๊อกสินค้าทั้งหมด</p>
                <h2 id="stat-stock" class="text-3xl font-bold mt-1 text-blue-600">0</h2>
            </div>
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                <p class="text-slate-500 text-sm">สินค้าในระบบ</p>
                <h2 id="stat-items" class="text-3xl font-bold mt-1 text-indigo-600">0</h2>
            </div>
        </div>

        <section>
            <h3 class="text-lg font-bold mb-4 flex items-center gap-2"><i class="fa-solid fa-box-open text-blue-500"></i> จัดการสินค้าในคลัง</h3>
            <div id="products-grid" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-6">
                <!-- Product Cards here -->
            </div>
        </section>
    </main>

    <!-- Modal เพิ่มสินค้า -->
    <div id="productModal" class="hidden fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white w-full max-w-lg rounded-3xl overflow-hidden shadow-2xl animate-[fadeIn_0.3s]">
            <div class="p-6 border-b flex justify-between items-center">
                <h3 class="text-xl font-bold text-slate-800">ข้อมูลสินค้า</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-red-500"><i class="fa-solid fa-times text-xl"></i></button>
            </div>
            <div class="p-6 space-y-5">
                <input type="hidden" id="prod-id">
                
                <!-- อัปโหลดรูป -->
                <div class="flex flex-col items-center p-4 border-2 border-dashed border-slate-200 rounded-2xl bg-slate-50 hover:border-blue-400 transition cursor-pointer relative">
                    <input type="file" id="prod-file" accept="image/*" class="absolute inset-0 opacity-0 cursor-pointer" onchange="previewImage(this)">
                    <img id="img-preview" src="" class="hidden w-full h-40 object-contain mb-2 rounded-lg">
                    <div id="upload-placeholder" class="text-center">
                        <i class="fa-solid fa-cloud-arrow-up text-3xl text-slate-300 mb-2"></i>
                        <p class="text-sm text-slate-500">คลิกเพื่อเลือกรูปภาพจากเครื่อง</p>
                    </div>
                </div>

                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-600 mb-1">ชื่อสินค้า</label>
                        <input type="text" id="prod-name" placeholder="ระบุชื่อสินค้า..." class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none transition">
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-slate-600 mb-1">ราคา (บาท)</label>
                            <input type="number" id="prod-price" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-600 mb-1">จำนวนสต๊อก</label>
                            <input type="number" id="prod-stock" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none">
                        </div>
                    </div>
                </div>
                <button id="btn-save" onclick="handleSave()" class="w-full bg-blue-600 text-white font-bold py-4 rounded-xl shadow-lg hover:bg-blue-700 transition-all flex justify-center items-center gap-2">
                    <i class="fa-solid fa-save"></i> บันทึกข้อมูล
                </button>
            </div>
        </div>
    </div>

    <script>
        // --- 1. Firebase Config ---
        const firebaseConfig = {
            apiKey: "AIzaSyAWUWpDnF5Yt7QQ0ULvsxSVJhV0ckGMfu8",
            databaseURL: "https://chatcharin-af5e4-default-rtdb.firebaseio.com",
            projectId: "chatcharin-af5e4",
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const imbbKey = '13feb354942b1cf393189ee5a5ae6c5a';

        let productsData = {};

        // --- 2. Image Management ---
        function previewImage(input) {
            const preview = document.getElementById('img-preview');
            const placeholder = document.getElementById('upload-placeholder');
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = e => {
                    preview.src = e.target.result;
                    preview.classList.remove('hidden');
                    placeholder.classList.add('hidden');
                }
                reader.readAsDataURL(input.files[0]);
            }
        }

        async function uploadImage(file) {
            const formData = new FormData();
            formData.append('image', file);
            const res = await fetch(`https://api.imgbb.com/1/upload?key=${imbbKey}`, {
                method: 'POST',
                body: formData
            });
            const data = await res.json();
            return data.data.url;
        }

        // --- 3. Product Logic ---
        function openProductModal() {
            document.getElementById('prod-id').value = '';
            document.getElementById('prod-name').value = '';
            document.getElementById('prod-price').value = '';
            document.getElementById('prod-stock').value = '';
            document.getElementById('prod-file').value = '';
            document.getElementById('img-preview').classList.add('hidden');
            document.getElementById('upload-placeholder').classList.remove('hidden');
            document.getElementById('productModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('productModal').classList.add('hidden');
        }

        async function handleSave() {
            const id = document.getElementById('prod-id').value || 'P' + Date.now();
            const name = document.getElementById('prod-name').value;
            const price = parseFloat(document.getElementById('prod-price').value);
            const stock = parseInt(document.getElementById('prod-stock').value);
            const file = document.getElementById('prod-file').files[0];
            const btn = document.getElementById('btn-save');

            if (!name || isNaN(price)) return Swal.fire('ข้อมูลไม่ครบ', 'กรุณากรอกชื่อและราคาให้ถูกต้อง', 'warning');

            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> กำลังอัปโหลด...';

            try {
                let imageUrl = productsData[id]?.image || 'https://via.placeholder.com/500';
                if (file) {
                    imageUrl = await uploadImage(file);
                }

                await db.ref(`store_data/products/${id}`).set({ name, price, stock, image: imageUrl });
                Swal.fire({ icon: 'success', title: 'สำเร็จ', showConfirmButton: false, timer: 1000 });
                closeModal();
            } catch (e) {
                Swal.fire('Error', 'อัปโหลดล้มเหลว: ' + e.message, 'error');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-save"></i> บันทึกข้อมูล';
            }
        }

        function deleteProduct(id) {
            Swal.fire({
                title: 'ยืนยันการลบ?',
                text: "ลบแล้วกู้คืนไม่ได้นะ!",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#ef4444',
                confirmButtonText: 'ลบเลย'
            }).then((result) => {
                if (result.isConfirmed) db.ref(`store_data/products/${id}`).remove();
            });
        }

        // --- 4. Render & Sync ---
        db.ref('store_data/products').on('value', snap => {
            productsData = snap.val() || {};
            const grid = document.getElementById('products-grid');
            grid.innerHTML = '';
            
            let totalStock = 0;
            let itemsCount = 0;

            Object.entries(productsData).forEach(([id, p]) => {
                itemsCount++;
                totalStock += p.stock;
                grid.innerHTML += `
                    <div class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden hover:shadow-xl transition-all duration-300 group">
                        <div class="relative h-44 overflow-hidden">
                            <img src="${p.image}" class="w-full h-full object-cover group-hover:scale-110 transition duration-500">
                            <div class="absolute top-2 right-2 bg-white/90 backdrop-blur px-2 py-1 rounded-lg text-xs font-bold text-slate-700">
                                ${p.stock > 0 ? 'สต๊อก: ' + p.stock : '<span class="text-red-500">หมด</span>'}
                            </div>
                        </div>
                        <div class="p-4">
                            <h4 class="font-bold text-slate-800 truncate mb-1">${p.name}</h4>
                            <p class="text-blue-600 font-bold text-lg">฿${p.price.toLocaleString()}</p>
                            <div class="flex gap-2 mt-4">
                                <button onclick="deleteProduct('${id}')" class="flex-1 text-slate-400 hover:text-red-500 hover:bg-red-50 p-2 rounded-lg transition">ลบ</button>
                            </div>
                        </div>
                    </div>`;
            });

            document.getElementById('stat-stock').innerText = totalStock;
            document.getElementById('stat-items').innerText = itemsCount;
        });

        db.ref('store_data/orders').on('value', snap => {
            document.getElementById('stat-orders').innerText = snap.numChildren();
        });
    </script>
</body>
</html>
