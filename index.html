<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
  async function main() {
    await liff.init({ liffId: "2009974431-rZ9Od5w1" });
    
    if (!liff.isLoggedIn()) {
      liff.login();
    } else {
      const profile = await liff.getProfile();
      const userId = profile.userId; // นี่คือ User ID (U...) ที่เราต้องการ

      // ส่งข้อมูลไปที่ Netlify Function (ตัวอย่างในข้อถัดไป)
      await fetch('/.netlify/functions/send-message', {
        method: 'POST',
        body: JSON.stringify({
          userId: userId,
          message: "สวัสดีจากหน้าเว็บ!"
        })
      });
      alert("ส่งข้อความเรียบร้อย!");
    }
  }
  main();
</script>
