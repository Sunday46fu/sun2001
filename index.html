<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
    <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-database-compat.js"></script>
</head>
<body>
    <div style="max-width: 400px; margin: auto; padding: 20px; border: 1px solid #ccc;">
        <h3>ตั้งค่าคำตอบบอท</h3>
        <input type="text" id="k" placeholder="ถ้าพิมพ์ว่า..." style="width:100%; margin-bottom:10px;">
        <input type="text" id="r" placeholder="ให้ตอบว่า..." style="width:100%; margin-bottom:10px;">
        <button onclick="save()" style="width:100%; background:#00b900; color:#fff; border:none; padding:10px;">บันทึก</button>
        <div id="list" style="margin-top:20px;"></div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAWUWpDnF5Yt7QQ0ULvsxSVJhV0ckGMfu8",
            authDomain: "chatcharin-af5e4.firebaseapp.com",
            databaseURL: "https://chatcharin-af5e4-default-rtdb.firebaseio.com",
            projectId: "chatcharin-af5e4",
            storageBucket: "chatcharin-af5e4.firebasestorage.app",
            messagingSenderId: "631954642041",
            appId: "1:631954642041:web:586447ace8ad055ca3f0a8",
            measurementId: "G-2GNPMEF6E4"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function save() {
            const k = document.getElementById('k').value;
            const r = document.getElementById('r').value;
            if(k && r) {
                db.ref('bot_rules/' + k).set(r).then(() => {
                    alert('บันทึกสำเร็จ');
                    document.getElementById('k').value = '';
                    document.getElementById('r').value = '';
                });
            }
        }

        db.ref('bot_rules').on('value', (snap) => {
            let html = '<b>รายการคำสั่ง:</b><br>';
            snap.forEach(c => { html += `<div>${c.key} -> ${c.val()}</div>`; });
            document.getElementById('list').innerHTML = html;
        });
    </script>
</body>
</html>
