<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LINE Message Sender</title>
    <style>
        body { font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; background: #f7f8fa; }
        .card { background: white; padding: 2rem; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); width: 350px; }
        h2 { color: #333; text-align: center; margin-bottom: 1.5rem; }
        input { width: 100%; padding: 12px; margin-bottom: 1rem; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 14px; }
        button { background: #06c755; color: white; border: none; padding: 12px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; width: 100%; }
        button:hover { background: #05a346; }
        #status { margin-top: 1rem; font-size: 13px; color: #888; text-align: center; }
    </style>
</head>
<body>
    <div class="card">
        <h2>LINE Sender</h2>
        <input type="text" id="userId" placeholder="วาง userId ที่นี่ เช่น U805ed94...">
        <input type="text" id="message" placeholder="พิมพ์ข้อความ..." value="สวัสดีครับ!">
        <button onclick="sendMessage()">ส่งข้อความ</button>
        <p id="status"></p>
    </div>

    <script>
        async function sendMessage() {
            const userId = document.getElementById('userId').value.trim();
            const message = document.getElementById('message').value.trim();
            const status = document.getElementById('status');

            if (!userId || !message) {
                status.style.color = "red";
                status.innerText = "กรุณากรอก userId และข้อความ";
                return;
            }

            status.style.color = "#888";
            status.innerText = "กำลังส่ง...";

            try {
                const res = await fetch('/.netlify/functions/send-message', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userId, message })
                });

                const data = await res.json();

                if (res.ok) {
                    status.style.color = "#06c755";
                    status.innerText = "ส่งสำเร็จ! ✅";
                } else {
                    status.style.color = "red";
                    status.innerText = "ส่งล้มเหลว: " + (data.error || "unknown error");
                }
            } catch (err) {
                status.style.color = "red";
                status.innerText = "Error: " + err.message;
            }
        }
    </script>
</body>
</html>
