<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mobile Profile with Buttons</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@400;600&display=swap');

    body {
      margin: 0;
      font-family: 'Kanit', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      background: linear-gradient(135deg, #1f1c2c, #928dab);
      color: white;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .top-left-icon {
      position: absolute;
      top: 20px;
      left: 20px;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #3b5998, #8b9dc3);
      border-radius: 50%;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
      transition: transform 0.3s;
    }

    .top-left-icon:hover {
      transform: scale(1.2);
    }

    .top-left-icon img {
      width: 60%;
      height: 60%;
      object-fit: contain;
    }

    .profile {
      margin-top: 20px;
      width: 120px;
      height: 120px;
      border-radius: 50%;
      overflow: hidden;
      box-shadow: 0 8px 15px rgba(0, 0, 0, 0.5);
      animation: float 3s ease-in-out infinite;
    }

    .profile img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .buttons {
      margin-top: 30px;
      display: flex;
      flex-direction: column;
      width: 90%;
    }

    .button {
      margin: 10px 0;
      padding: 15px;
      text-align: center;
      background: linear-gradient(135deg, #ff416c, #ff4b2b);
      color: white;
      text-decoration: none;
      border-radius: 15px;
      font-size: 18px;
      font-weight: 600;
      text-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
      box-shadow: 0 8px 15px rgba(255, 65, 108, 0.5);
      transition: transform 0.3s, box-shadow 0.3s;
      animation: glow 2s infinite alternate;
    }

    .button:hover {
      transform: scale(1.1);
      box-shadow: 0 12px 20px rgba(255, 65, 108, 0.8);
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-10px);
      }
    }

    @keyframes glow {
      from {
        box-shadow: 0 8px 15px rgba(255, 65, 108, 0.5);
      }
      to {
        box-shadow: 0 8px 30px rgba(255, 65, 108, 0.9);
      }
    }
  </style>
</head>
<body>

  <!-- Facebook Icon -->
  <a href="https://www.facebook.com/share/18cfbqaAnF/" class="top-left-icon">
    <img src="https://upload.wikimedia.org/wikipedia/commons/5/51/Facebook_f_logo_%282019%29.svg" alt="Facebook Icon">
  </a>

  <!-- Profile Section -->
  <div class="profile">
    <img src="https://i.postimg.cc/qR4Nnqw1/1000038135.jpg" alt="Profile Picture">
  </div>

  <!-- Buttons Section -->
  <div class="buttons">
    <a href="https://www.mediafire.com/file/mhs9trisawqetdw/" class="button">ดูดหัว99%</a>
    <a href="https://www.mediafire.com/file/yhzrp3cobqsxktc/SOCKET_VIP_V3.apk/" class="button">VPN กันแบน(ต่อเมื่อมึงเล่นไฟล์เนียนอะนะ)</a>
    <a href="https://www.mediafire.com/file/fws4c4h1kvenc1n/PAINEL_ESP_SHOP_AIMBOT_100%2525.zip/" class="button">พาแนล ดูดหัว99%+SHOP[Vip4999941][3684537] Android</a>
    <a href="https://www.mediafire.com/file/wxhag390glbtwg7/HOLOGRAM_BIRU_FAMZZY999.zip/" class="button">ไฟล์ OBB มองทะลุ ตัวแดง</a>
    <a href="#" class="button">การเล่นไฟล์มีโอกาสโดนแบนสูง</a>
    <a href="#" class="button">อย่าสันดานหมาเอาไฟล์ฟรีไปขาย สวะ</a>
  </div>

</body>
</html>
